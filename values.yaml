vaultEnv: dev
# values.yaml for support-backend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/support-backend
  tag: "development-77adc83"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
networkPolicy:
  enabled: true
  allowedServices: []
  # gateway-backend is already hardcoded in the policy template
  # Add any other services that need direct access (if any)
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "600Mi"
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://10.0.0.4:5432/fitnest_support?sslmode=disable"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATA_REDIS_HOST: "10.0.0.4"
  SPRING_DATA_REDIS_PORT: "6380"
  KAFKA_BOOTSTRAP_SERVERS: "10.0.0.4:9092"
  JWT_ISSUER: "fitnest"
  IDENTITY_BACKEND_URL: "http://identity-backend:8080"
  USER_BACKEND_URL: "http://user-backend:8080"
  STORAGE_BACKEND_URL: "http://storage-backend:8080"
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-backend.fitnest-development.svc.cluster.local:9090"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

resources:
  requests:
    cpu: 20m
    memory: 748Mi
  limits:
    cpu: 1000m
    memory: 1150Mi

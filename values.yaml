hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 600Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/support-backend
  tag: production-fea4337
networkPolicy:
  allowedServices: []
  enabled: true
replicaCount: 1
resources:
  requests:
    cpu: 200m
    memory: 1024Mi
  limits:
    cpu: 1500m
    memory: 1536Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: production
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
